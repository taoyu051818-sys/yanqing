services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: yanqing
      POSTGRES_USER: yanqing
      POSTGRES_PASSWORD: yanqing_dev_password
    ports:
      - "5432:5432"
    volumes:
      - yanqing_postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U yanqing -d yanqing"]
      interval: 5s
      timeout: 5s
      retries: 20

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    env_file:
      - apps/api/.env
    environment:
      DATABASE_URL: postgresql://yanqing:yanqing_dev_password@postgres:5432/yanqing?schema=public
    ports:
      - "3200:3200"
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  yanqing_postgres:
