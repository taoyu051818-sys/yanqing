name: Verify production applications
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: yanqing_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s --health-timeout 5s --health-retries 5
    env:
      DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/yanqing_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - uses: pnpm/action-setup@v4
        with:
          version: 11
      - run: pnpm install --frozen-lockfile
      - run: pnpm --dir apps/api prisma:generate
      - run: pnpm --dir apps/api db:deploy
      - run: pnpm --dir packages/shared build
      - run: pnpm lint
      - run: pnpm test:shared && pnpm test:api && pnpm test:miniapp && pnpm test:admin
      - run: pnpm --dir apps/api test:e2e
      - run: pnpm --dir apps/api exec vitest run --no-file-parallelism test/payment-lifecycle.integration.spec.ts test/registration-boundaries.integration.spec.ts test/operations-boundaries.integration.spec.ts test/ledger-boundaries.integration.spec.ts test/entitlement-boundaries.integration.spec.ts test/lead-boundaries.integration.spec.ts test/admission-boundaries.integration.spec.ts test/venue-operation-boundaries.integration.spec.ts test/goods-payment-stock.integration.spec.ts
        env:
          TEST_DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/yanqing_test
      - name: Reporting database boundaries
        working-directory: apps/api
        run: |
          pnpm exec node --input-type=module -e 'import pg from "pg"; const c=new pg.Client({connectionString:process.env.DATABASE_URL}); await c.connect(); await c.query("CREATE DATABASE yanqing_reporting_test"); await c.end();'
          export DATABASE_URL=postgresql://postgres:postgres@127.0.0.1:5432/yanqing_reporting_test
          pnpm db:deploy
          TEST_DATABASE_URL="$DATABASE_URL" pnpm exec vitest run test/reporting-boundaries.integration.spec.ts
      - run: pnpm build:api && pnpm build:admin
      - run: pnpm build:miniapp
        env:
          VITE_DATA_MODE: remote
          VITE_API_BASE_URL: https://api.yutechhn.cn/api/v1
