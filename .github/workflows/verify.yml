name: Verify production applications
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: yanqing_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s --health-timeout 5s --health-retries 5
    env:
      DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/yanqing_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - uses: pnpm/action-setup@v4
        with:
          version: 11
      - run: pnpm install --frozen-lockfile
      - run: pnpm --dir apps/api prisma:generate
      - run: pnpm --dir apps/api db:deploy
      - run: pnpm --dir packages/shared build
      - run: pnpm check:docs
      - run: pnpm lint
      - run: pnpm test:ops
      - run: pnpm test:release:miniapp
      - run: pnpm test:shared && pnpm test:api && pnpm test:miniapp && pnpm test:admin
      - run: pnpm --dir apps/api test:e2e
      - name: Core lifecycle acceptance matrix
        run: pnpm test:core-lifecycle
        env:
          TEST_DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/yanqing_test
      - run: pnpm build:api && pnpm build:admin
      - run: pnpm build:miniapp
        env:
          VITE_DATA_MODE: remote
          VITE_API_BASE_URL: https://api.yutechhn.cn/api/v1

  core-ui:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - uses: pnpm/action-setup@v4
        with:
          version: 11
      - run: pnpm install --frozen-lockfile
      - run: pnpm --dir packages/shared build
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm test:ui
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: core-ui-evidence
          path: output/ui-acceptance
          retention-days: 14

  # Keep the protected check named "verify": both API/database and UI must pass.
  verify:
    needs: [quality, core-ui]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Require all verification jobs
        env:
          QUALITY_RESULT: ${{ needs.quality.result }}
          UI_RESULT: ${{ needs.core-ui.result }}
        run: test "$QUALITY_RESULT" = success && test "$UI_RESULT" = success
