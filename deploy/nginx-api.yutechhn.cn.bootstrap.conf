server {
    listen 80;
    listen [::]:80;
    server_name api.yutechhn.cn;
    server_tokens off;

    access_log /var/log/nginx/yanqing-api.access.log;
    error_log /var/log/nginx/yanqing-api.error.log warn;

    location ^~ /.well-known/acme-challenge/ {
        root /var/lib/letsencrypt;
        default_type text/plain;
        try_files $uri =404;
    }

    # TLS 证书签发前仅用于域名解析和健康检查验证。
    location = /api/v1 {
        proxy_pass http://127.0.0.1:33200;
        include proxy_params;
        proxy_set_header X-Forwarded-Proto http;
    }

    location ^~ /api/v1/ {
        proxy_pass http://127.0.0.1:33200;
        include proxy_params;
        proxy_set_header X-Forwarded-Proto http;
        proxy_read_timeout 120s;
        proxy_send_timeout 120s;
    }

    location ^~ /uploads/ {
        proxy_pass http://127.0.0.1:33200;
        include proxy_params;
        proxy_set_header X-Forwarded-Proto http;
    }

    location / {
        return 404;
    }
}
