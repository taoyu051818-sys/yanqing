name: yanqing-domain

services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-yanqing_domain_acceptance}
      POSTGRES_USER: ${POSTGRES_USER:-yanqing_domain_acceptance}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
    volumes:
      - yanqing_domain_postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-yanqing_domain_acceptance} -d ${POSTGRES_DB:-yanqing_domain_acceptance}"]
      interval: 5s
      timeout: 5s
      retries: 20

  api:
    build:
      context: ..
      dockerfile: apps/api/Dockerfile
    restart: unless-stopped
    environment:
      NODE_ENV: staging
      PORT: 3200
      API_PREFIX: api/v1
      DATABASE_URL: postgresql://${POSTGRES_USER:-yanqing_domain_acceptance}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-yanqing_domain_acceptance}?schema=public
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET is required}
      JWT_EXPIRES_IN: 1d
      CORS_ORIGINS: https://${PUBLIC_DOMAIN:?PUBLIC_DOMAIN is required},https://www.${PUBLIC_DOMAIN}
      PAYMENT_PROVIDER: mock
      STORAGE_PROVIDER: local
      STORAGE_LOCAL_PATH: /app/storage
      SMS_PROVIDER: mock
    ports:
      - "127.0.0.1:${API_PORT:-33200}:3200"
    volumes:
      - yanqing_domain_storage:/app/storage
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:3200/api/v1/health >/dev/null"]
      interval: 10s
      timeout: 5s
      retries: 12

  h5:
    build:
      context: ..
      dockerfile: apps/miniapp/Dockerfile.h5
      args:
        VITE_API_BASE_URL: https://${API_DOMAIN:?API_DOMAIN is required}/api/v1
        VITE_DATA_MODE: remote
        VITE_ENABLE_REMOTE_DEV_LOGIN: "true"
        VITE_PUBLIC_BASE_PATH: ${PUBLIC_BASE_PATH:-/badminton/}
    restart: unless-stopped
    ports:
      - "127.0.0.1:${H5_PORT:-38080}:80"
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1/healthz >/dev/null"]
      interval: 10s
      timeout: 5s
      retries: 12

volumes:
  yanqing_domain_postgres:
  yanqing_domain_storage:
