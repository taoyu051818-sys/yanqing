server {
    listen 127.0.0.1:38080;
    server_name _;
    root /var/www/yanqing-badminton/current;
    index index.html;
    server_tokens off;

    access_log /var/log/nginx/yanqing-badminton-h5.access.log;
    error_log /var/log/nginx/yanqing-badminton-h5.error.log warn;

    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    location ~* \.(?:js|css|png|jpg|jpeg|gif|svg|ico|woff2?)$ {
        try_files $uri =404;
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-store";
    }
}
