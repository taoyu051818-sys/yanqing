name: yanqing-staging

services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-yanqing_staging}
      POSTGRES_USER: ${POSTGRES_USER:-yanqing_staging}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
    volumes:
      - yanqing_staging_postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-yanqing_staging} -d ${POSTGRES_DB:-yanqing_staging}"]
      interval: 5s
      timeout: 5s
      retries: 20

  api:
    build:
      context: ..
      dockerfile: apps/api/Dockerfile
    restart: unless-stopped
    environment:
      NODE_ENV: staging
      PORT: 3200
      API_PREFIX: api/v1
      DATABASE_URL: postgresql://${POSTGRES_USER:-yanqing_staging}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-yanqing_staging}?schema=public
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET is required}
      JWT_EXPIRES_IN: 1d
      CORS_ORIGINS: http://${PUBLIC_IP:?PUBLIC_IP is required}:${H5_PORT:-8080},http://localhost:5173,http://127.0.0.1:5173
      PAYMENT_PROVIDER: mock
      STORAGE_PROVIDER: local
      STORAGE_LOCAL_PATH: /app/storage
      SMS_PROVIDER: mock
    ports:
      - "${API_PORT:-3200}:3200"
    volumes:
      - yanqing_staging_storage:/app/storage
    depends_on:
      postgres:
        condition: service_healthy

  h5:
    build:
      context: ..
      dockerfile: apps/miniapp/Dockerfile.h5
      args:
        VITE_API_BASE_URL: http://${PUBLIC_IP:?PUBLIC_IP is required}:${API_PORT:-3200}/api/v1
        VITE_DATA_MODE: remote
        VITE_ENABLE_REMOTE_DEV_LOGIN: "true"
    restart: unless-stopped
    ports:
      - "${H5_PORT:-8080}:80"
    depends_on:
      - api

volumes:
  yanqing_staging_postgres:
  yanqing_staging_storage:
