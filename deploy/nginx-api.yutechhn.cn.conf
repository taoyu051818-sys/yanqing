server {
    listen 80;
    listen [::]:80;
    server_name api.yutechhn.cn;
    server_tokens off;

    location ^~ /.well-known/acme-challenge/ {
        root /var/lib/letsencrypt;
        default_type text/plain;
        try_files $uri =404;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name api.yutechhn.cn;
    server_tokens off;

    ssl_certificate /etc/letsencrypt/live/api.yutechhn.cn/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/api.yutechhn.cn/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:YANQING_API_SSL:10m;
    ssl_session_timeout 1d;

    access_log /var/log/nginx/yanqing-api.access.log;
    error_log /var/log/nginx/yanqing-api.error.log warn;

    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy no-referrer always;

    client_max_body_size 10m;

    location = /api/v1 {
        proxy_pass http://127.0.0.1:33200;
        include proxy_params;
        proxy_set_header X-Forwarded-Proto https;
    }

    location ^~ /api/v1/ {
        proxy_pass http://127.0.0.1:33200;
        include proxy_params;
        proxy_set_header X-Forwarded-Proto https;
        proxy_read_timeout 120s;
        proxy_send_timeout 120s;
    }

    location ^~ /uploads/ {
        proxy_pass http://127.0.0.1:33200;
        include proxy_params;
        proxy_set_header X-Forwarded-Proto https;
        proxy_hide_header Cache-Control;
        # Each avatar upload has a new UUID filename. Cache successful images,
        # never an error response while a release or upload is in progress.
        add_header Cache-Control "public, max-age=604800, immutable";
        add_header X-Content-Type-Options nosniff always;
        add_header Referrer-Policy no-referrer always;
    }

    location / {
        return 404;
    }
}
